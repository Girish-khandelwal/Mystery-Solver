name: Build offline Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install website libraries without database setup
        run: npm ci --ignore-scripts
      - name: Install mobile libraries
        run: npm --prefix mobile ci
      - name: Test all cases and offline saves
        run: npm run mobile:test
      - name: Build bundled offline APK
        run: npm run mobile:apk
      - name: Verify APK has no Internet permission
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Offline APK unexpectedly requests Internet access."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: casefile-offline-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
