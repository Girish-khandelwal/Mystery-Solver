name: Build offline Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # This runner already includes API 36 and Build Tools 36.0.0.
      # Avoid replacing its SDK through a separate setup/download action.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          java -version
      - name: Install website libraries without database setup
        run: npm ci --ignore-scripts
      - name: Install mobile libraries
        run: npm --prefix mobile ci
      - name: Test all cases and offline saves
        run: npm run mobile:test
      - name: Build bundled offline APK
        run: |
          chmod +x mobile/android/gradlew
          npm run mobile:apk
      - name: Verify APK has no Internet permission
        shell: bash
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > "$RUNNER_TEMP/apk-permissions.txt"
          if grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/apk-permissions.txt"; then
            echo "Offline APK unexpectedly requests Internet access."
            exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: casefile-offline-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
